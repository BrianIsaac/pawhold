# Development only: the local Postgres for `pnpm dev` and the test suite.
# Render runs the deployed database (render.yaml).
name: pawhold

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pawhold
      POSTGRES_PASSWORD: pawhold
      POSTGRES_DB: pawhold
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pawhold-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawhold -d pawhold"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pawhold-db:
