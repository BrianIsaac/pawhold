# pawhold on Render (plan 7.3, decision D4): one web service, its Postgres
# and the hourly cron job, all paid plans so nothing sleeps before
# 16 December. Field names as the Blueprint YAML Reference reads on
# 12 October 2026 (https://render.com/docs/blueprint-spec). The operator's
# one-time steps are in a private runbook; tests/hosting/blueprint.test.ts
# holds this file to the plan.

services:
  - type: web
    name: pawhold
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: commit
    # NODE_ENV=development for the install only: pnpm skips devDependencies
    # (TypeScript, which `next build` needs) when NODE_ENV is production, and
    # whether Render sets it at build time is not documented on the pages read.
    buildCommand: NODE_ENV=development corepack pnpm install --frozen-lockfile && corepack pnpm build
    preDeployCommand: corepack pnpm db:migrate
    startCommand: corepack pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: pawhold-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ACCEPT_MOCK_WEBHOOKS
        value: "false"
      # The GB sandbox buyer's login, which the README publishes and the
      # owner's page shows in judge mode (U9); without it the page sends a
      # judge to the README for it.
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_DRAFTS_PER_HOUR
        value: "40"

  # The reauthorisation rule, the resumption of stalled discharges and the
  # sweep of unreconciled webhooks (U3), the schedule agent's sweep (U8a) and
  # the judge-session clean-up (U9) run here. Without PayPal's credentials the
  # rule is skipped and the clean-up prunes only sessions holding nothing at
  # PayPal (both logged), so the cron carries them too.
  - type: cron
    name: pawhold-hourly
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    schedule: "0 * * * *"
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm cron:hourly
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: pawhold-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

databases:
  - name: pawhold-db
    databaseName: pawhold
    user: pawhold
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    # Internal connections only: the web service and the cron job reach it
    # over Render's private network.
    ipAllowList: []
